x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    pull_policy: missing
    restart: unless-stopped
    environment:
      MODE: SLIM
      OB_DATAFILE_SIZE: ${OCEANBASE_DATAFILE_SIZE:-1G}
      OB_SYS_PASSWORD: ${OCEANBASE_PASSWORD:?OCEANBASE_PASSWORD is required}
      OB_TENANT_PASSWORD: ${OCEANBASE_PASSWORD:?OCEANBASE_PASSWORD is required}
      OB_CLUSTER_NAME: ${OCEANBASE_CLUSTER_NAME:-cozeAi}
    mem_limit: ${OCEANBASE_MEM_LIMIT:-2g}
    cpus: ${OCEANBASE_CPUS:-1.00}
    volumes:
      - oceanbase-ob:/root/ob
      - oceanbase-cluster:/root/.obd/cluster
    healthcheck:
      test:
        - CMD-SHELL
        - obclient -h127.0.0.1 -P2881 -uroot@test -p$${OB_TENANT_PASSWORD} -e "SELECT 1;"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - coze-dev
    logging: *default-logging

  nsqd:
    image: nsqio/nsq:v1.3.0
    pull_policy: missing
    command:
      - /nsqd
      - --data-path=/data
      - --mem-queue-size=0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    expose:
      - "4150"
      - "4151"
    volumes:
      - nsq-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:4151/ping | grep -qx OK
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - coze-dev
    logging: *default-logging

  coze-server:
    image: ${ACR_REGISTRY:?ACR_REGISTRY is required}/${ACR_NAMESPACE:?ACR_NAMESPACE is required}/coze-server:${SERVER_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      COZE_MQ_TYPE: nsq
      MQ_NAME_SERVER: nsqd:4150
      VECTOR_STORE_TYPE: oceanbase
      OCEANBASE_HOST: oceanbase
      OCEANBASE_PORT: "2881"
      OCEANBASE_USER: ${OCEANBASE_USER:-root@test}
      OCEANBASE_DATABASE: ${OCEANBASE_DATABASE:-test}
      OCEANBASE_PASSWORD: ${OCEANBASE_PASSWORD:?OCEANBASE_PASSWORD is required}
      AGENT_THREAD_RUNTIME_DEFAULT: eino_adk
      AGENT_THREAD_EINO_ADK_ENABLED: "true"
      AGENT_THREAD_WORKER_ENABLED: "true"
      AGENT_THREAD_RESUME_WORKER_ENABLED: "true"
      AGENT_THREAD_LEASE_RECOVERY_WORKER_ENABLED: "true"
    expose:
      - "8888"
    volumes:
      - type: bind
        source: ./app.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8888/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      oceanbase:
        condition: service_healthy
        restart: true
      nsqd:
        condition: service_healthy
        restart: true
    networks:
      - coze-dev
    logging: *default-logging

  coze-web:
    image: ${ACR_REGISTRY:?ACR_REGISTRY is required}/${ACR_NAMESPACE:?ACR_NAMESPACE is required}/coze-web:${WEB_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8888}:80"
    depends_on:
      coze-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - coze-dev
    logging: *default-logging

networks:
  coze-dev:
    driver: bridge

volumes:
  oceanbase-ob:
  oceanbase-cluster:
  nsq-data:
