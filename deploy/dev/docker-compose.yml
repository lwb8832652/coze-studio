services:
  coze-server:
    image: ${ACR_REGISTRY:?ACR_REGISTRY is required}/${ACR_NAMESPACE:?ACR_NAMESPACE is required}/coze-server:${SERVER_IMAGE_TAG:-dev}
    restart: unless-stopped
    expose:
      - "8888"
    volumes:
      - type: bind
        source: ./app.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8888/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - coze-dev

  coze-web:
    image: ${ACR_REGISTRY:?ACR_REGISTRY is required}/${ACR_NAMESPACE:?ACR_NAMESPACE is required}/coze-web:${WEB_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:80"
    depends_on:
      coze-server:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - coze-dev

networks:
  coze-dev:
    driver: bridge
