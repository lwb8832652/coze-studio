name: Publish and deploy dev images

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character Git commit SHA from origin/dev
        required: true
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      migration_changed: ${{ steps.resolve.outputs.migration_changed }}
      deployment_blocked: ${{ steps.resolve.outputs.deployment_blocked }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to ACR for deployed revision lookup
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve target and migration state
        id: resolve
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SERVER_DEV_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-server:dev
          WEB_DEV_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-web:dev
        run: |
          set -euo pipefail

          manifest_is_missing() {
            grep -Eiq 'manifest.*(unknown|not found)|not found.*manifest' "$1"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            target_sha=$TARGET_SHA_INPUT
            if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "target_sha must be a full 40-character hexadecimal SHA" >&2
              exit 1
            fi

            git fetch --no-tags origin dev
            if ! git merge-base --is-ancestor "$target_sha" refs/remotes/origin/dev; then
              echo "target_sha is not in the origin/dev history" >&2
              exit 1
            fi
            migration_changed=false
            deployment_blocked=false
          else
            target_sha=$GITHUB_SHA
            before=$BEFORE_SHA
            zero_sha=0000000000000000000000000000000000000000
            migration_changed=false
            deployment_blocked=true

            if [[ "$before" =~ ^[0-9a-fA-F]{40}$ ]] &&
              [ "$before" != "$zero_sha" ] &&
              git cat-file -e "${before}^{commit}" 2>/dev/null &&
              git cat-file -e "${target_sha}^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$before" "$target_sha"; then
              server_pull_error=$(mktemp)
              web_pull_error=$(mktemp)
              trap 'rm -f -- "$server_pull_error" "$web_pull_error"' EXIT

              server_pull_status=0
              web_pull_status=0
              docker pull "$SERVER_DEV_IMAGE" >/dev/null 2>"$server_pull_error" || server_pull_status=$?
              docker pull "$WEB_DEV_IMAGE" >/dev/null 2>"$web_pull_error" || web_pull_status=$?

              if [ "$server_pull_status" -eq 0 ] && [ "$web_pull_status" -eq 0 ]; then
                server_inspect_status=0
                web_inspect_status=0
                server_deployed_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$SERVER_DEV_IMAGE" 2>/dev/null) || server_inspect_status=$?
                web_deployed_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$WEB_DEV_IMAGE" 2>/dev/null) || web_inspect_status=$?

                if [ "$server_inspect_status" -eq 0 ] && [ "$web_inspect_status" -eq 0 ]; then
                  server_deployed_revision=$(printf '%s' "$server_deployed_revision" | tr '[:upper:]' '[:lower:]')
                  web_deployed_revision=$(printf '%s' "$web_deployed_revision" | tr '[:upper:]' '[:lower:]')

                  if [[ "$server_deployed_revision" =~ ^[0-9a-fA-F]{40}$ ]] &&
                    [[ "$web_deployed_revision" =~ ^[0-9a-fA-F]{40}$ ]] &&
                    [ "$server_deployed_revision" = "$web_deployed_revision" ]; then
                    deployed_revision=$server_deployed_revision
                    if git cat-file -e "${deployed_revision}^{commit}" 2>/dev/null &&
                      git merge-base --is-ancestor "$deployed_revision" "$target_sha"; then
                      comparison_base=$deployed_revision
                      if git diff --quiet "$comparison_base" "$target_sha" -- docker/atlas/migrations; then
                        migration_changed=false
                        deployment_blocked=false
                      else
                        diff_status=$?
                        if [ "$diff_status" -eq 1 ]; then
                          migration_changed=true
                          deployment_blocked=false
                        else
                          echo "migration diff failed; blocking deployment" >&2
                        fi
                      fi
                    else
                      echo "deployed revision is unavailable from target history; blocking deployment" >&2
                    fi
                  else
                    echo "deployed server and web revisions are missing or inconsistent; blocking deployment" >&2
                  fi
                else
                  echo "deployed server or web image inspection failed; blocking deployment" >&2
                fi
              elif [ "$server_pull_status" -ne 0 ] &&
                [ "$web_pull_status" -ne 0 ] &&
                manifest_is_missing "$server_pull_error" &&
                manifest_is_missing "$web_pull_error"; then
                comparison_base=$before
                if git diff --quiet "$comparison_base" "$target_sha" -- docker/atlas/migrations; then
                  migration_changed=false
                  deployment_blocked=false
                  echo "current dev image manifests are absent; allowing bootstrap deployment"
                else
                  diff_status=$?
                  if [ "$diff_status" -eq 1 ]; then
                    migration_changed=true
                    deployment_blocked=false
                    echo "current dev image manifests are absent; allowing bootstrap deployment"
                  else
                    echo "bootstrap migration diff failed; blocking deployment" >&2
                  fi
                fi
              else
                echo "current dev images could not be verified; blocking deployment" >&2
              fi
            else
              echo "migration comparison base is unavailable; blocking deployment" >&2
            fi
          fi

          target_sha=$(printf '%s' "$target_sha" | tr '[:upper:]' '[:lower:]')
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'migration_changed=%s\n' "$migration_changed" >> "$GITHUB_OUTPUT"
          printf 'deployment_blocked=%s\n' "$deployment_blocked" >> "$GITHUB_OUTPUT"

  build-server:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Check out target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-server:dev-${{ needs.preflight.outputs.target_sha }}
          build-args: |
            GIT_REVISION=${{ needs.preflight.outputs.target_sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

  build-web:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Check out target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-web:dev-${{ needs.preflight.outputs.target_sha }}
          build-args: |
            GIT_REVISION=${{ needs.preflight.outputs.target_sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

  migration-hold:
    runs-on: ubuntu-latest
    needs: [preflight, build-server, build-web]
    if: ${{ github.event_name == 'push' && needs.preflight.outputs.migration_changed == 'true' }}
    steps:
      - name: Record manual migration hold
        shell: bash
        run: |
          target_sha="${{ needs.preflight.outputs.target_sha }}"
          {
            echo "## Dev deployment held for migrations"
            echo
            echo "- Target SHA: \`$target_sha\`"
            echo "- Apply pending Atlas migrations manually on the remote dev environment."
            echo "- Then run this workflow with workflow_dispatch and target_sha set to the same SHA."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-images:
    runs-on: ubuntu-latest
    needs: [preflight, build-server, build-web]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.migration_changed != 'true' &&
      (
        (
          github.event_name == 'push' &&
          needs.build-server.result == 'success' &&
          needs.build-web.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.build-server.result == 'skipped' &&
          needs.build-web.result == 'skipped'
        )
      )
    env:
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      SERVER_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-server:dev-${{ needs.preflight.outputs.target_sha }}
      WEB_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-web:dev-${{ needs.preflight.outputs.target_sha }}
    steps:
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify immutable image revisions
        shell: bash
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE" "$WEB_IMAGE"; do
            docker pull "$image"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            if [ "$revision" != "$TARGET_SHA" ]; then
              echo "image revision does not match target SHA: $image" >&2
              exit 1
            fi
          done

  promote:
    runs-on: ubuntu-latest
    needs: [preflight, build-server, build-web, verify-images]
    outputs:
      target_sha: ${{ needs.preflight.outputs.target_sha }}
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.migration_changed != 'true' &&
      (
        (
          github.event_name == 'push' &&
          needs.build-server.result == 'success' &&
          needs.build-web.result == 'success' &&
          needs.verify-images.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.build-server.result == 'skipped' &&
          needs.build-web.result == 'skipped' &&
          needs.verify-images.result == 'success'
        )
      )
    steps:
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote server image
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-server:dev" \
            "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-server:dev-${{ needs.preflight.outputs.target_sha }}"

      - name: Promote web image
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-web:dev" \
            "${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/coze-web:dev-${{ needs.preflight.outputs.target_sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: promote
    if: ${{ needs.promote.result == 'success' }}
    env:
      BAOTA_WEBHOOK_URL: ${{ secrets.BAOTA_WEBHOOK_URL }}
      BAOTA_WEBHOOK_TOKEN: ${{ secrets.BAOTA_WEBHOOK_TOKEN }}
      BAOTA_WEBHOOK_PINNED_PUBKEY: ${{ vars.BAOTA_WEBHOOK_PINNED_PUBKEY }}
      TARGET_SHA: ${{ needs.promote.outputs.target_sha }}
    steps:
      - name: Trigger dev deployment
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(
            --fail-with-body
            --silent
            --show-error
            --request POST
            --header 'Content-Type: application/json'
          )
          if [ -n "${BAOTA_WEBHOOK_TOKEN:-}" ]; then
            curl_args+=(--header "Authorization: Bearer $BAOTA_WEBHOOK_TOKEN")
          fi
          if [ -n "${BAOTA_WEBHOOK_PINNED_PUBKEY:-}" ]; then
            if [[ ! "$BAOTA_WEBHOOK_PINNED_PUBKEY" =~ ^sha256//[A-Za-z0-9+/]{43}=$ ]]; then
              echo "BAOTA_WEBHOOK_PINNED_PUBKEY must be a curl sha256 public key pin" >&2
              exit 1
            fi
            curl_args+=(--insecure --pinnedpubkey "$BAOTA_WEBHOOK_PINNED_PUBKEY")
          fi
          payload=$(printf '{"target_sha":"%s"}' "$TARGET_SHA")
          curl_args+=(--data "$payload" "$BAOTA_WEBHOOK_URL")
          curl "${curl_args[@]}"
